<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DELA · Sahumerios & aromas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FCF3EE;--sand:#EFE2D8;--ink:#3B2A25;--soft:#7A665D;--red:#8A2F28;--line:#DCCABD;
--serif:'Newsreader',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;overflow-x:hidden;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,a,li{touch-action:manipulation}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
section{padding:min(18vh,9rem) 1.5rem}
.wrap{max-width:1080px;margin:auto}
.logo{width:min(340px,70vw)}
.logo img{width:100%;display:block}
h1,h2{font-family:var(--serif);font-weight:300;line-height:1.1}
.btn{display:inline-block;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:var(--bg);background:var(--red);padding:1.1rem 2.2rem;text-decoration:none;border-radius:2px;transition:background .4s,transform .4s}
.btn:hover{background:#6E231D;transform:translateY(-2px)}
.reveal{opacity:1;transform:none}

#hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:2.2rem}
#hero h1{font-size:clamp(1.9rem,5vw,3rem);color:var(--ink)}
#hero p{color:var(--soft)}

#intro{text-align:center}
#intro h2{font-size:clamp(1.6rem,3.6vw,2.4rem);max-width:21em;margin:auto}
#intro h2 em{color:var(--red);font-style:italic}

.eyebrow{font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--red);margin-bottom:1.4rem}
#explorar h2{font-size:clamp(1.8rem,4vw,2.8rem);margin-bottom:2.5rem}
.tabs{display:flex;gap:.4rem 1.6rem;flex-wrap:wrap;margin-bottom:3.5rem;font-size:.9rem}
.tabs button{all:unset;cursor:pointer;color:var(--soft);padding:.3rem 0;border-bottom:1px solid transparent;transition:color .3s,border-color .3s}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--red);border-color:var(--red)}
.stage{display:grid;grid-template-columns:1fr;gap:2.5rem}
@media(min-width:820px){.stage{grid-template-columns:5fr 6fr;gap:6rem;align-items:start}.pic{position:sticky;top:2rem}}
.pic{aspect-ratio:1/1;background:var(--sand);overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:1.2rem;width:100%}
.cap{position:relative}
.pic.has .cap{background:rgba(252,243,238,.92);padding:.9rem 1.2rem}
.pic.has b{font-size:clamp(1.3rem,3vw,1.7rem)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.4s}
.pic:hover img{transform:scale(1.04)}
.pic small{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
.pic b{font-family:var(--serif);font-weight:300;font-size:clamp(1.8rem,4vw,2.6rem);color:var(--red);line-height:1.1;position:relative}
.pic small{position:relative}

ul{list-style:none;padding:0}
li{border-top:1px solid var(--line);padding:1.3rem 0;display:flex;justify-content:space-between;align-items:baseline;gap:1rem;cursor:pointer}
li:last-child{border-bottom:1px solid var(--line)}
li .n{font-family:var(--serif);font-size:1.5rem;font-weight:300;transition:color .3s,transform .4s}
li:hover .n,li.on .n{color:var(--red);transform:translateX(6px)}
li .d{display:block;font-size:.82rem;color:var(--soft)}
li .meta{display:none;font-size:.85rem;color:var(--soft);margin-top:.3rem}
li.on .meta{display:block}
.step{display:flex;align-items:center;gap:.5rem;align-self:center;flex:none}
.step button{all:unset;cursor:pointer;width:32px;height:32px;border-radius:50%;border:1px solid var(--red);color:var(--red);display:grid;place-items:center;font-size:1.1rem;line-height:1;transition:background .3s,color .3s,opacity .3s}
.step button:hover{background:var(--red);color:var(--bg)}
.step button:disabled{opacity:.3;cursor:not-allowed;background:none;color:var(--red)}
.step button[hidden],.step .q[hidden]{display:none}
.step .q{min-width:1.4ch;text-align:center;font-size:.95rem}
.agot{align-self:center;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);flex:none}
li.out{cursor:default}
li.out .n,li.out .d{opacity:.45}
.sel{font-size:.9rem;color:var(--red);margin:-1rem auto 2rem;max-width:34em}

#cierre{background:var(--sand);text-align:center}
#cierre h2{font-size:clamp(2rem,5vw,3.4rem);margin-bottom:1.2rem}
#cierre p{color:var(--soft);margin-bottom:2.6rem}
#cierre .ship{font-family:var(--serif);font-style:italic;color:var(--red);font-size:1.2rem;margin-top:3rem;margin-bottom:0}
footer{padding:3rem 1.5rem;text-align:center;font-size:.85rem;color:var(--soft)}
footer b{display:block;font-family:var(--serif);font-weight:400;font-size:1.3rem;letter-spacing:.3em;color:var(--red)}
footer a{color:var(--ink);text-decoration:none;margin:0 .8rem}
footer a:hover{color:var(--red)}
footer a svg{width:22px;height:22px;display:block}
.fab{position:fixed;right:1.2rem;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;background:var(--red);display:grid;place-items:center;opacity:.9;transition:transform .3s;z-index:99;cursor:pointer}
.fab:hover{transform:scale(1.07)}
.fab svg{width:22px;fill:var(--bg)}
.fab span{display:none;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--bg);font-weight:500}
.fab.has{width:auto;padding:0 1.3rem;gap:.7rem;border-radius:999px;display:flex;align-items:center;height:52px}
.fab.has span{display:inline}
.fab{text-decoration:none}
@media(max-width:819px){
 .tabs{flex-wrap:nowrap;overflow-x:auto;margin-inline:-1.5rem;padding-inline:1.5rem;scrollbar-width:none;gap:1.6rem;scroll-snap-type:x proximity}
 .tabs::-webkit-scrollbar{display:none}
 .tabs button{white-space:nowrap;padding:.7rem 0;scroll-snap-align:start}
 .pic{padding:.9rem}
 li{padding:1.1rem 0}
 li .n{font-size:1.35rem}
 .step button{width:38px;height:38px}
 .stage{gap:1.5rem}
}
@media(max-width:560px){
 section{padding:5rem 1.25rem}
 #hero{gap:1.8rem;padding-bottom:6rem}
 .btn{display:block;width:100%;max-width:340px;margin-inline:auto;text-align:center;padding:1.2rem 1rem}
 #explorar h2{margin-bottom:1.8rem}
 .tabs{margin-bottom:2rem;margin-inline:-1.25rem;padding-inline:1.25rem}
 footer{padding:3rem 1.25rem 6rem}
 footer a{display:inline-block;padding:.5rem .6rem;margin:0}
 .fab{right:1rem}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
